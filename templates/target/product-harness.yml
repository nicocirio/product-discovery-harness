version: 1
mode: pending
mode_detection:
  status: pending
  evidence: []
legacy_stance: reference
repository_scope:
  include: ["."]
  exclude: [".git", "node_modules", "deps", "build", "dist", "tmp", "vendor"]
languages:
  interaction: auto
  documentation: auto
discovery:
  current_phase: mode-selection
  require_explicit_acceptance_for_decisions: true
  preserve_session_summaries: true
  ask_one_primary_question_at_a_time: true
integration:
