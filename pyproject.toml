[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-discovery-harness"
version = "0.1.1"
description = "Installable product discovery skills and durable repository contract"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
product-harness = "product_discovery_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_discovery_harness = ["../../templates/**/*", "../../schemas/*.json"]
