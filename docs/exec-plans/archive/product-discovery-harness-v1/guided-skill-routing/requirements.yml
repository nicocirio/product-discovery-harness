work_item: guided-skill-routing
requirements:
- title: Define a consistent next-focus output contract for every installed product
    skill
  id: FR-001
- title: Add friendly explicit recovery routes for missing target setup, raw ideas,
    unknown IDs, and unmet specialist prerequisites
  id: FR-002
- title: Preserve explicit owner confirmation and existing product record boundaries
    while improving routing
  id: FR-003
- title: Keep README learning claims, skill protocols, and automated verification
    aligned
  id: FR-004
acceptance_criteria:
- title: Each of the nineteen SKILL.md files requires one Recommended next focus in
    its output contract
  id: AC-001
- title: Every ID-taking or stateful specialist skill explains a usable route when
    its prerequisite is absent or unresolved
  id: AC-002
- title: Product-talk and product-resume remain valid no-expertise entry points and
    no protocol permits automatic promotion or acceptance
  id: AC-003
- title: Automated tests verify skill-contract coverage, recovery routing, and README
    alignment
  id: AC-004
- title: Full repository and Harness validation gates pass
  id: AC-005
